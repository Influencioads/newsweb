# Link-preview crawlers (WhatsApp, Facebook, Telegram, X...) run no JavaScript,
# so they never see the SPA's per-story tags. A crawler asking for a story gets
# the API's Open Graph head instead (backend app/api/v1/crawler.py): the real
# headline and the share card with the story photo. Everything else a crawler
# asks for gets the site's own head. Googlebot is deliberately not matched: it
# renders JavaScript and indexes the SPA as readers see it.
map $http_user_agent $is_link_crawler {
    default 0;
    "~*(whatsapp|facebookexternalhit|facebookcatalog|twitterbot|telegrambot|slackbot|linkedinbot|discordbot|pinterest|skypeuripreview|redditbot|vkshare|embedly|quora\ link\ preview|nuzzel|bitlybot)" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The API container, looked up when a crawler asks (Docker's DNS), so the
    # site still starts while the API is restarting.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api api:8000;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /fonts/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Pictures are pictures for crawlers too: WhatsApp fetches og:image with
    # the same user agent it reads the page with.
    location ~* \.(png|jpe?g|webp|gif|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # A story: /{category}/{slug}-{shortId}, the short id being 6 characters.
    location ~ "^/[a-z0-9-]+/(?<slugid>[A-Za-z0-9_-]+-[A-Za-z0-9_-]{6})$" {
        if ($is_link_crawler) {
            proxy_pass http://$api/_og/article/$slugid;
        }
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        if ($is_link_crawler) {
            proxy_pass http://$api/_og/home;
        }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
