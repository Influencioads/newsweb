<!doctype html>
<html lang="te">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#A61C24" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      §4.1: preload the 400-weight Telugu BODY font only. Preloading more than one
      face delays LCP on the 4G mid-range Android we are targeting (§10.3).
    -->
    <link
      rel="preload"
      href="/fonts/noto-sans-telugu-telugu.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>టాప్ తెలుగు న్యూస్ · Top Telugu News</title>
    <meta
      name="description"
      content="తెలుగు వార్తలు, ఈ-పేపర్, వీడియోలు — ఆంధ్రప్రదేశ్ మరియు తెలంగాణ జిల్లా వార్తలతో."
    />

    <!--
      A baseline link preview for every route that is not an article. Article
      URLs never reach this file when a crawler asks for them: nginx sends
      link-preview bots to the API's /_og/article/* stub, which carries the
      real headline and a rendered Telugu card. See app/api/v1/crawler.py.

      These stay static on purpose. A SPA cannot set og: tags in time —
      WhatsApp and Facebook do not run JavaScript at all — so anything dynamic
      here would be read as nothing.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="టాప్ తెలుగు న్యూస్" />
    <meta property="og:title" content="టాప్ తెలుగు న్యూస్ · Top Telugu News" />
    <meta
      property="og:description"
      content="తెలుగు వార్తలు, ఈ-పేపర్, వీడియోలు — ఆంధ్రప్రదేశ్ మరియు తెలంగాణ జిల్లా వార్తలతో."
    />
    <meta property="og:image" content="/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="te_IN" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 24px; font-family: 'Noto Sans Telugu', sans-serif; line-height: 1.7">
        ఈ వెబ్‌సైట్ చూడటానికి JavaScript అవసరం.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
