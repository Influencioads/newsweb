[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# The URL is injected from app.core.config at runtime (alembic/env.py).
# It is deliberately left blank here so credentials never live in a tracked file.
sqlalchemy.url =

# Migrations are numbered and forward-only (§3: "All DB access via migrations.
# Nobody touches production schema by hand — ever.")
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Formatting of generated migrations is handled by `ruff format` in CI,
# not by a post-write hook (entrypoint lookup is unreliable inside a venv).


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
