# nginx reverse proxy + edge cache.
#
# This file carries the requirement §10.1 assigned to Next.js ISR. The mandated
# stack is a Vite SPA, which cannot do on-demand ISR, so the same guarantee —
# "a breaking-news spike must land on the cache, not on MySQL" — is met here:
#
#   * public GET responses are cached by nginx for the TTL the API advertises
#   * stale-while-revalidate keeps serving during a backend blip
#   * a publish purges the Redis cache; nginx re-fills within one TTL window
#   * the push-worker pre-warms the article URL before any campaign (§10.1)
#
# See docs/SOURCE_CONFLICTS.md C-3.

proxy_cache_path /var/cache/nginx/public
                 levels=1:2
                 keys_zone=public_cache:50m
                 max_size=2g
                 inactive=10m
                 use_temp_path=off;

limit_req_zone $binary_remote_addr zone=api_global:10m rate=100r/m;   # §12.1
limit_req_zone $binary_remote_addr zone=api_auth:10m   rate=20r/m;    # §6.2

upstream news_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # TLS terminates here in production (certbot). HSTS is set by the API too,
    # but a redirect response never reaches the app, so it is repeated here.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 500m;          # e-paper PDFs run 80-300 MB (§8.1)
    client_body_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain
               image/svg+xml application/xml application/rss+xml;

    # ---------------------------------------------------------------- assets
    # Fonts and hashed build assets are immutable; cache them hard.
    location /fonts/ {
        root /srv/www;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        types { font/woff2 woff2; }
    }

    location /assets/ {
        root /srv/www;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------- public API cache
    location /api/v1/public/ {
        proxy_pass http://news_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        proxy_cache public_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 60s;
        proxy_cache_valid 404 10s;
        # Serve stale rather than hammer the origin — this is what absorbs the
        # 20k concurrent hits a 200k-device push produces in 60 seconds.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        # An authenticated preview must never be served from the shared cache.
        proxy_cache_bypass $http_authorization;
        proxy_no_cache     $http_authorization;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ------------------------------------------------------------ auth limits
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://news_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------- rest of API
    location /api/ {
        limit_req zone=api_global burst=40 nodelay;
        proxy_pass http://news_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_read_timeout 120s;
        # CMS responses are per-user; never cache them.
        proxy_cache off;
    }

    # Crawler-facing SEO documents are rendered by the API (§10.3), not the SPA.
    location ~ ^/(news-sitemap\.xml|sitemap.*\.xml|rss.*|robots\.txt)$ {
        proxy_pass http://news_api;
        proxy_cache public_cache;
        proxy_cache_valid 200 300s;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://news_api;
        access_log off;
    }

    # ---------------------------------------------------------------- the SPA
    location / {
        root /srv/www;
        try_files $uri $uri/ /index.html;
        # index.html itself must never be cached, or a deploy will not reach users.
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }
}
