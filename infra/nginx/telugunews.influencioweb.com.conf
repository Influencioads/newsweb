# Link-preview crawlers run no JavaScript and the reader is a Vite SPA, so a
# bot asking for an article is sent to the API's server-rendered OG head.
# Deliberately NOT Googlebot: it renders JS and indexes the SPA correctly.
# Keep this in sync with infra/caddy/Caddyfile and the reference config in
# infra/nginx/news-platform.conf, whichever edge is live.
map $http_user_agent $is_link_crawler {
    default 0;
    "~*(whatsapp|facebookexternalhit|facebookcatalog|twitterbot|telegrambot|slackbot|linkedinbot|discordbot|pinterest|skypeuripreview|redditbot|vkshare|embedly|quora\ link\ preview|nuzzel|bitlybot)" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name telugunews.influencioweb.com;

    client_max_body_size 500m;

    location ~ ^/(api|health|media|docs|redoc)(/|$) {
        proxy_pass http://127.0.0.1:8004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # robots.txt, the sitemaps and the feed are served by the API, not the SPA
    # bundle. Without this they fall through below and return index.html.
    location ~ ^/(robots\.txt|sitemap.*\.xml|news-sitemap\.xml|rss.*)$ {
        proxy_pass http://127.0.0.1:8004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # An article URL: /{category}/{slug}-{shortId}, where shortId is a 6-char
    # nanoid. Requiring exactly six characters after the final hyphen is what
    # keeps /section/andhra-pradesh and /epaper/2026-09-11 out of here.
    location ~ "^/[a-z0-9-]+/(?<slugid>[A-Za-z0-9_-]+-[A-Za-z0-9_-]{6})$" {
        if ($is_link_crawler) {
            proxy_pass http://127.0.0.1:8004/_og/article/$slugid;
        }
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
