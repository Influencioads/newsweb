# Telugu News Platform — local development stack.
#
# Ports are deliberately offset (3307 / 6380 / 7701) so this stack never collides
# with a MySQL/Redis already installed on the host machine.
#
#   docker compose up -d mysql redis meilisearch     # infrastructure only
#   docker compose --profile app up -d               # + api, worker, beat
#
name: telugu-news

services:
  mysql:
    image: mysql:8.4
    container_name: tn-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --explicit_defaults_for_timestamp=ON
      - --ngram_token_size=2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-telugu_news}
      MYSQL_USER: ${MYSQL_USER:-news}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-newspass}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tn-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: tn-meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-devMasterKeyChangeMe}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILISEARCH_PORT:-7701}:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: ../infra/docker/api.Dockerfile
    container_name: tn-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MEILISEARCH_URL: http://meilisearch:7700
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - storage_data:/app/var/storage
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      meilisearch: {condition: service_healthy}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: ../infra/docker/api.Dockerfile
    container_name: tn-worker
    restart: unless-stopped
    env_file: [.env]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MEILISEARCH_URL: http://meilisearch:7700
    volumes:
      - ./backend:/app
      - storage_data:/app/var/storage
    depends_on:
      api: {condition: service_started}
    # solo pool: ffmpeg/PDF work is CPU-bound and must never starve the API (§2)
    command: ["celery", "-A", "app.workers.celery_app.celery", "worker", "-l", "info", "--pool=solo"]

  # The crawl gets its own consumer because `crawl.*` routes to the `ingest`
  # queue. Without this container those tasks queue in Redis forever and
  # nothing reports an error — GET /cms/crawl/status is what makes that
  # visible, via its `stale` flag.
  worker-ingest:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: ../infra/docker/api.Dockerfile
    container_name: tn-worker-ingest
    restart: unless-stopped
    env_file: [.env]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MEILISEARCH_URL: http://meilisearch:7700
    volumes:
      - ./backend:/app
      - storage_data:/app/var/storage
    depends_on:
      api: {condition: service_started}
    # solo pool is fine: the concurrency lives in the task's own thread pool,
    # and the fetcher's per-host throttle is per *process* — a second replica
    # would silently double our request rate at every publisher.
    command: ["celery", "-A", "app.workers.celery_app.celery", "worker", "-l", "info", "--pool=solo", "-Q", "ingest"]

  beat:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: ../infra/docker/api.Dockerfile
    container_name: tn-beat
    restart: unless-stopped
    env_file: [.env]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./backend:/app
    depends_on:
      api: {condition: service_started}
    command: ["celery", "-A", "app.workers.celery_app.celery", "beat", "-l", "info"]

volumes:
  mysql_data:
  redis_data:
  meili_data:
  storage_data:
